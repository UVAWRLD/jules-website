<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crow preview</title>
<style>
  body{margin:0;background:#ECECEC;color:#0A0A0A;font:12px/1.4 Inter,Helvetica,Arial,sans-serif}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}
  figure{margin:0}
  figcaption{padding:4px 2px;color:#8A8A88}
  canvas{display:block;width:100%;background:#ECECEC;border:1px solid rgba(0,0,0,.12)}
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
// Draws the baked cloud flat, without the halftone pass, so poses can be judged directly.
const {createCrow} = await import("/src/crow.js?v=" + Date.now());   // dodge the module cache
const W=520,H=380;

const crow=createCrow("/public/models/");
await new Promise(r=>{ const w=()=>crow.ready?r():setTimeout(w,40); w(); });

function panel(title, drive){
  const fig=document.createElement("figure");
  const cv=document.createElement("canvas");
  cv.width=W*2; cv.height=H*2;
  const cap=document.createElement("figcaption");
  fig.append(cv,cap); document.getElementById("grid").append(fig);
  const ctx=cv.getContext("2d"); ctx.scale(2,2);
  const c={w:W,h:H,perchX:W*0.5,perchY:H*0.66,sway:[0,0],scale:150,reduce:false};
  crow.replay();
  drive(c);
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle="rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.moveTo(40,c.perchY); ctx.lineTo(W-40,c.perchY); ctx.stroke();
  const p=crow.positions;
  for(let i=0;i<crow.count;i++){
    const x=p[i*3],y=p[i*3+1],z=p[i*3+2];
    ctx.fillStyle=`rgba(10,10,10,${0.3+0.7*z})`;
    ctx.fillRect(x,y,1.5,1.5);
  }
  const [x0,y0,x1,y1]=crow.bbox;
  ctx.strokeStyle="rgba(0,0,0,.3)"; ctx.strokeRect(x0,y0,x1-x0,y1-y0);
  cap.textContent=`${title} — ${Math.round(x1-x0)}x${Math.round(y1-y0)}px, ${crow.count} points, ${crow.phase}`;
}
const run=(c,secs,dt=1/60)=>{ for(let t=0;t<secs;t+=dt) crow.update(dt,c); };

panel("perched, early", c=>run(c,4.2));
panel("perched, a peck later", c=>run(c,7.5));
panel("perched, later still", c=>run(c,9.5));
panel("fly in, mid", c=>run(c,1.9));
panel("takeoff, the leap", c=>{ run(c,4.2); crow.click(W); run(c,0.35); });
panel("takeoff, climbing", c=>{ run(c,4.2); crow.click(W); run(c,0.9); });
</script>
</body>
</html>
