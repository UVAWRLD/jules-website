<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Jules B. M.</title>
<!-- favicon: the logo mark, an SVG that turns light on a dark tab; PNGs for Safari and the
     home screen, favicon.ico at the root for anything that asks for it there -->
<link rel="icon" href="public/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="public/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="public/img/apple-touch-icon.png">
<meta name="description" content="Jules Bockelee Morvan: projects.">
<script>
  // the visitor's own choice of dark, from the pull chain on the home page
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
</script>
<link rel="preload" href="public/fonts/Satoshi-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/site.css">
<style>
  /* The Projects page. A first cut: only the Timeline's frame (logo, title, back link, the rule
     the crow lands on), sized and placed exactly as there, so moving between the two pages
     nothing shifts. The project cards come next, from Figma: Projects portfolio.
     These rules are the Timeline's header, copied; when this page grows they should move into
     src/site.css for both. */
  :root{--k:1.1332}
  .tl{position:relative;width:calc(var(--k) * 537px);max-width:calc(100% - 48px);margin:0 auto;
    padding:164px 0 calc(var(--k) * 72px)}
  #crowStage{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
  .tl-head{position:relative;display:flex;justify-content:space-between;align-items:baseline;
    padding-bottom:calc(var(--k) * 15px)}
  .tl-head::after{content:"";position:absolute;left:0;right:0;bottom:calc(var(--k) * -0.5px);
    height:calc(var(--k) * 1px);background:var(--ink);
    -webkit-mask:url(public/img/timeline/rule.svg) no-repeat 0 0/100% 100%;
    mask:url(public/img/timeline/rule.svg) no-repeat 0 0/100% 100%}
  .tl-head h1{margin:0;font-family:"Libre Caslon Condensed",Georgia,serif;font-weight:500;
    font-size:calc(var(--k) * 24px);line-height:calc(var(--k) * 21px);color:var(--ink)}
  .tl-intro{margin:calc(var(--k) * 16px) 0 0;font-size:calc(var(--k) * 11px);line-height:1.2;
    letter-spacing:calc(var(--k) * -0.22px);color:var(--body)}
  @media (max-width:820px){
    :root{--k:1}
    .tl{padding-top:112px}
  }
</style>
</head>
<body>

<a class="mark" href="./" aria-label="Home"></a>
<nav class="pagenav" aria-label="Pages"><a href="timeline">Timeline<svg class="go" viewBox="0 0 8 8" aria-hidden="true"><path d="M1.5 6.5 L6.5 1.5 M2.6 1.5 H6.5 V5.4" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg></a><a href="projects" aria-current="page">Projects</a><a href="./">← Back<i class="home" aria-hidden="true"></i></a></nav>

<main class="tl">
  <header class="tl-head">
    <h1>Projects</h1>
  </header>

  <p class="tl-intro">Project cards are on their way.</p>
</main>

<script type="module">
  // The crow, as on the Timeline: in from the right, down onto the rule under the title
  import { createCrowStage } from "./src/crowstage.js";
  createCrowStage({ perchOn: document.querySelector(".tl-head"), perchAt: 0.5, dir: -1 });
</script>
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
